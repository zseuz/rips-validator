spring.application.name=rips-validator

# --- Base de datos -------------------------------------------------------------------
# H2 en archivo (api/data/) para desarrollo: no requiere instalar nada y el historial sobrevive
# a los reinicios. Con el perfil "mysql" (application-mysql.properties) se usa MySQL, que es lo
# que levanta docker compose.
spring.datasource.url=jdbc:h2:file:./data/rips;AUTO_SERVER=TRUE
# El esquema lo crean las migraciones de Flyway (db/migration); Hibernate solo comprueba que
# las entidades coincidan con él.
spring.jpa.hibernate.ddl-auto=validate
# Consola para consultar la base en desarrollo: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/rips;AUTO_SERVER=TRUE, usuario sa, sin contraseña)
spring.h2.console.enabled=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# --- Servidor ------------------------------------------------------------------------
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1KB
server.error.include-stacktrace=never
# Errores con formato estándar RFC 9457 (application/problem+json).
spring.mvc.problemdetails.enabled=true

# --- Observabilidad ------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# --- Límites de la validación (LimitesFilter) ----------------------------------------
rips.limites.tamano-maximo=25MB
rips.limites.validaciones-por-minuto=60

# --- CORS (frontend Angular en desarrollo) -------------------------------------------
rips.cors.origenes-permitidos=http://localhost:4200
