spring.application.name=rips-validator

# --- Base de datos -------------------------------------------------------------------
# H2 en memoria para desarrollo: no requiere instalar nada. Con el perfil "mysql"
# (application-mysql.properties) se usa MySQL, que es lo que levanta docker compose.
spring.datasource.url=jdbc:h2:mem:rips;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# --- Servidor ------------------------------------------------------------------------
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1KB
server.error.include-stacktrace=never
# Errores con formato estándar RFC 9457 (application/problem+json).
spring.mvc.problemdetails.enabled=true

# --- Observabilidad ------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# --- CORS (frontend Angular en desarrollo) -------------------------------------------
rips.cors.origenes-permitidos=http://localhost:4200
