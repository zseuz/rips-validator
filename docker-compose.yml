services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rips
      MYSQL_USER: rips
      MYSQL_PASSWORD: ${DB_PASSWORD:-rips_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/rips
      DB_USER: rips
      DB_PASSWORD: ${DB_PASSWORD:-rips_local}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  mysql-data:
