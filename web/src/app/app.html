<!-- Manchas de color difuminadas detrás de todo: le dan algo que desenfocar al vidrio de las tarjetas. -->
<div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
  <div class="absolute -top-40 -left-32 h-[28rem] w-[28rem] rounded-full bg-indigo-400/25 blur-3xl dark:bg-indigo-600/20"></div>
  <div class="absolute top-1/3 -right-40 h-[26rem] w-[26rem] rounded-full bg-emerald-300/20 blur-3xl dark:bg-emerald-500/10"></div>
  <div class="absolute -bottom-40 left-1/3 h-[24rem] w-[24rem] rounded-full bg-sky-300/20 blur-3xl dark:bg-sky-600/10"></div>
</div>

<div class="flex min-h-screen flex-col">
  <header class="sticky top-0 z-30 border-b border-slate-200/70 bg-white/70 backdrop-blur-md dark:border-slate-800/70 dark:bg-slate-950/60">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3 sm:px-6">
      <a routerLink="/" class="group flex items-center gap-3">
        <span class="grid h-10 w-10 place-items-center rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white shadow-lg shadow-indigo-500/30 transition-transform duration-300 group-hover:scale-105 group-hover:rotate-3">
          <app-icono nombre="escudo" [tamano]="22" />
        </span>
        <span class="leading-tight">
          <span class="block text-base font-bold tracking-tight whitespace-nowrap text-slate-900 dark:text-white">Validador RIPS</span>
          <span class="hidden text-xs text-slate-500 sm:block dark:text-slate-400">Resolución 2275 de 2023</span>
        </span>
      </a>

      <nav class="flex items-center gap-2" aria-label="Secciones">
        <div class="flex rounded-xl bg-slate-100/80 p-1 dark:bg-slate-800/60">
          <a
            routerLink="/"
            routerLinkActive="bg-white text-indigo-600 shadow-sm dark:bg-slate-700 dark:text-white"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-sm sm:px-3 font-semibold text-slate-600 transition-all hover:text-slate-900 dark:text-slate-300 dark:hover:text-white">
            <app-icono nombre="escudo" [tamano]="16" />
            <span class="sr-only sm:not-sr-only">Validar</span>
          </a>
          <a
            routerLink="/historial"
            routerLinkActive="bg-white text-indigo-600 shadow-sm dark:bg-slate-700 dark:text-white"
            class="flex items-center gap-2 rounded-lg px-2.5 py-1.5 text-sm sm:px-3 font-semibold text-slate-600 transition-all hover:text-slate-900 dark:text-slate-300 dark:hover:text-white">
            <app-icono nombre="historial" [tamano]="16" />
            <span class="sr-only sm:not-sr-only">Historial</span>
          </a>
        </div>

        @let oscuro = tema.tema() === 'oscuro';
        <button
          type="button"
          class="tema grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-white/80 text-slate-600 shadow-sm transition-all hover:-translate-y-0.5 hover:text-indigo-600 hover:shadow-md active:scale-95 dark:border-slate-700 dark:bg-slate-800/80 dark:text-slate-300 dark:hover:text-amber-300"
          [attr.aria-label]="oscuro ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
          [title]="oscuro ? 'Tema claro' : 'Tema oscuro'"
          (click)="tema.alternar()">
          @if (oscuro) {
            <app-icono nombre="sol" [tamano]="18" class="animate-girar" />
          } @else {
            <app-icono nombre="luna" [tamano]="18" class="animate-girar" />
          }
        </button>
      </nav>
    </div>
  </header>

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6 sm:py-10">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-200/70 dark:border-slate-800/70">
    <p class="mx-auto max-w-6xl px-4 py-5 text-sm text-slate-500 sm:px-6 dark:text-slate-400">
      Proyecto de portafolio, no oficial: no reemplaza la validación del Ministerio de Salud.
      <a href="https://github.com/zseuz/rips-validator" target="_blank" rel="noopener" class="font-medium text-indigo-600 hover:underline dark:text-indigo-400">Ver el código en GitHub</a>
    </p>
  </footer>
</div>
