<header class="barra">
  <div class="barra__contenido">
    <a routerLink="/" class="marca">
      <span class="marca__icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z" fill="currentColor" /></svg>
      </span>
      <span>RIPS <strong>Validator</strong></span>
    </a>
    <nav>
      <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Validar</a>
      <a routerLink="/historial" routerLinkActive="activo">Historial</a>
      @let oscuro = tema.tema() === 'oscuro';
      <button
        type="button"
        class="tema"
        [attr.aria-label]="oscuro ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
        [title]="oscuro ? 'Tema claro' : 'Tema oscuro'"
        (click)="tema.alternar()">
        @if (oscuro) {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        }
      </button>
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer>
  Proyecto de portafolio, no oficial · No reemplaza la validación del Ministerio de Salud ·
  <a href="https://github.com/zseuz/rips-validator" target="_blank" rel="noopener">Código en GitHub</a>
</footer>
