server {
    listen 80;
    root /usr/share/nginx/html;

    # Los RIPS grandes pueden pesar varios MB.
    client_max_body_size 25m;

    # Mismo origen que el frontend: sin CORS en producción.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Rutas de Angular (/historial, /validaciones/3) caen en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
